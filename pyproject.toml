[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "auronix"
version = "0.1.0"
description = "A controlled autonomous personal intelligence system"
requires-python = ">=3.11"

[project.scripts]
auronix = "auronix.interfaces.cli:main"

[project.optional-dependencies]
gemini = [
    "google-genai>=1,<3",
]
dev = [
    "pytest>=9,<10",
]

[tool.setuptools.packages.find]
where = ["src"]
