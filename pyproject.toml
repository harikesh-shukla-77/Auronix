[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "auronix"
version = "0.2.0"
description = "Personal AI assistant with security foundation and voice interface"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Harikesh Shukla" }]
dependencies = [
    "httpx>=0.27",
    "cryptography>=41",
    "pydantic>=2",
    "psutil>=5.9",
    "python-dateutil>=2.8",
    "onnxruntime>=1.16.0",
    "rumps>=0.4.0",
    "silero-vad>=4.0",
    "kokoro>=0.9.2",
    "sounddevice>=0.4.6",
    "peruse-ai>=0.1.0",
    "playwright>=1.50.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
voice = [
    "mlx-whisper>=0.4",
    "faster-whisper>=1.0",
    "piper-tts>=1.8",
    "pyaudio>=0.2",
    "pynput>=1.7",
]
security = []
dev = ["pytest>=8"]

[project.scripts]
auronix = "auronix_product.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests/product"]
python_files = ["test_*.py"]
addopts = "-v"

